<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iStore - Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ═══════════════════════════════════════════════════════════
           1. VARIABLES & THEMES
           ═══════════════════════════════════════════════════════════ */
        :root {
            --bg: #0b0b0f;
            --bg-elev: #141419;
            --card-bg: rgba(28, 28, 32, 0.72);
            --modal-bg: #1c1c20;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f5f5f7;
            --subtext: #8e8e93;
            --accent: #0a84ff;
            --accent2: #5e5ce6;
            --danger: #ff453a;
            --success: #32d74b;
            --warning: #ff9f0a;
            --radius: 18px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --bg-elev: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 0, 0, 0.08);
            --text: #1c1c1e;
            --subtext: #6c6c70;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        [data-theme="gold"] {
            --bg: #0a0805;
            --card-bg: rgba(40, 30, 10, 0.7);
            --accent: #d4af37;
            --accent2: #b8860b;
            --text: #f5e6c8;
        }

        [data-theme="sea"] {
            --bg: #001524;
            --card-bg: rgba(2, 48, 71, 0.7);
            --accent: #00b4d8;
            --accent2: #0077b6;
            --text: #e0fbfc;
        }

        /* ═══════════════════════════════════════════════════════════
           2. RESET & BASE
           ═══════════════════════════════════════════════════════════ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            padding-bottom: calc(100px + var(--safe-bottom));
        }
        svg { width: 24px; height: 24px; max-width: 100%; max-height: 100%; display: block; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

        /* ═══════════════════════════════════════════════════════════
           3. HEADER & SEARCH
           ═══════════════════════════════════════════════════════════ */
        .header {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px;
            background: rgba(var(--bg), 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--card-bg); border: 1px solid var(--border);
        }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .search-bar {
            position: relative; margin-bottom: 20px;
        }
        .search-bar svg {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--subtext); width: 20px; height: 20px;
        }
        .search-bar input {
            width: 100%; padding: 14px 16px 14px 48px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; color: var(--text); font-size: 15px;
            font-family: inherit; outline: none; transition: 0.2s;
        }
        .search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(10,132,255,0.2); }

        /* ═══════════════════════════════════════════════════════════
           4. FILTERS & CARDS
           ═══════════════════════════════════════════════════════════ */
        .filters {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 20px;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 8px 20px; border-radius: 20px;
            background: var(--card-bg); border: 1px solid var(--border);
            font-weight: 700; font-size: 14px; white-space: nowrap;
        }
        .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .section-title { margin-bottom: 16px; }
        .section-title h2 { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
        .section-title p { color: var(--accent); font-size: 14px; font-weight: 700; }

        .card {
            background: var(--card-bg); border-radius: 24px;
            border: 1px solid var(--border); overflow: hidden;
            margin-bottom: 20px; box-shadow: var(--shadow);
            animation: slideUp 0.4s ease-out backwards;
        }
        .card-banner { position: relative; height: 180px; background: #222; }
        .card-banner img { width: 100%; height: 100%; object-fit: cover; }
        .card-badge {
            position: absolute; top: 12px; right: 12px;
            padding: 4px 12px; border-radius: 20px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            color: #fff; font-size: 12px; font-weight: 800;
        }
        .card-content { padding: 16px; display: flex; gap: 16px; align-items: flex-start; }
        .card-icon { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; border: 1px solid var(--border); }
        .card-info { flex: 1; }
        .card-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .card-info .publisher { font-size: 12px; color: var(--warning); font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
        .card-info .desc { font-size: 13px; color: var(--subtext); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* ═══════════════════════════════════════════════════════════
           5. BOTTOM NAV & FLOATING BUTTONS
           ═══════════════════════════════════════════════════════════ */
        .bottom-nav-wrap {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 0 20px calc(20px + var(--safe-bottom));
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            pointer-events: none; z-index: 100;
        }
        .nav-row { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 400px; }
        .nav-menu {
            flex: 1; display: flex; justify-content: space-around; padding: 10px;
            background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 30px; box-shadow: var(--shadow);
            pointer-events: auto;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--subtext); font-size: 10px; font-weight: 800; transition: 0.2s;
        }
        .nav-item.active { color: var(--accent); }
        .nav-item svg { width: 22px; height: 22px; }

        .search-fab {
            width: 54px; height: 54px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.4); pointer-events: auto;
        }

        .robot-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--accent); pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(10, 132, 255, 0.5);
            animation: float 3s ease-in-out infinite;
        }
        .robot-face {
            width: 30px; height: 24px; background: #fff; border-radius: 8px;
            position: relative; display: flex; justify-content: center; align-items: center; gap: 4px;
        }
        .robot-eye { width: 6px; height: 6px; background: #000; border-radius: 50%; }

        /* ═══════════════════════════════════════════════════════════
           6. MODALS & UTILS
           ═══════════════════════════════════════════════════════════ */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); z-index: 1000;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal.open { opacity: 1; pointer-events: auto; }
        .modal-content {
            width: 100%; max-width: 500px; background: var(--bg-elev);
            border-radius: 30px 30px 0 0; padding: 24px;
            transform: translateY(100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal.open .modal-content { transform: translateY(0); }
        
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
        .theme-btn {
            padding: 12px; border-radius: 12px; background: var(--bg);
            border: 2px solid transparent; font-weight: 700; font-size: 12px;
        }
        .theme-btn.active { border-color: var(--accent); }

        /* ═══════════════════════════════════════════════════════════
           7. ANIMATIONS
           ═══════════════════════════════════════════════════════════ */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">i<span>Store</span></div>
        <button class="icon-btn" onclick="openSettings()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="Search any app, game or tool...">
        </div>

        <div class="filters">
            <button class="filter-chip active">All</button>
            <button class="filter-chip">iOS</button>
            <button class="filter-chip">Android</button>
            <button class="filter-chip">Games</button>
            <button class="filter-chip">Apps</button>
        </div>

        <div class="section-title">
            <h2 id="dateText">Today</h2>
            <p>⚡ Special Updates & Highlights</p>
        </div>

        <div id="app-grid">
            <!-- Cards will be injected here by JS -->
        </div>
    </main>

    <!-- Bottom Nav & Floating Buttons -->
    <div class="bottom-nav-wrap">
        <!-- Robot -->
        <button class="robot-btn" onclick="alert('🤖 AI Assistant is ready!')">
            <div class="robot-face">
                <div class="robot-eye"></div>
                <div class="robot-eye"></div>
            </div>
        </button>

        <div class="nav-row">
            <div class="nav-menu">
                <button class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span>Today</span>
                </button>
                <button class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="3"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/></svg>
                    <span>Games</span>
                </button>
                <button class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                    <span>Apps</span>
                </button>
                <button class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    <span>Tools</span>
                </button>
            </div>
            <button class="search-fab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </div>
    </div>

    <!-- Settings / Theme Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="font-size:20px; font-weight:900;">Settings</h3>
                <button onclick="closeSettings()" style="color:var(--subtext);">✕</button>
            </div>
            
            <p style="font-weight:700; margin-bottom:10px; font-size:14px;">Choose Theme</p>
            <div class="theme-grid">
                <button class="theme-btn" onclick="setTheme('dark')">Dark</button>
                <button class="theme-btn" onclick="setTheme('light')">Light</button>
                <button class="theme-btn" onclick="setTheme('gold')">Gold</button>
                <button class="theme-btn" onclick="setTheme('sea')">Sea</button>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // 1. DUMMY DATA (For UI Testing Only)
        // ═══════════════════════════════════════════════════════════
        const apps = [
            {
                id: 1,
                name: "Pixel Art Editor",
                publisher: "@pixel_team",
                platform: "IPA",
                icon: "https://picsum.photos/seed/pixel/100/100",
                banner: "https://picsum.photos/seed/pixelbanner/600/300",
                desc: "Create stunning pixel art on your iPhone with advanced tools."
            },
            {
                id: 2,
                name: "Space Shooter X",
                publisher: "@space_games",
                platform: "APK",
                icon: "https://picsum.photos/seed/space/100/100",
                banner: "https://picsum.photos/seed/spacebanner/600/300",
                desc: "Defend the galaxy in this retro style arcade shooter game."
            },
            {
                id: 3,
                name: "VLC Media Player",
                publisher: "@videolan",
                platform: "IPA",
                icon: "https://picsum.photos/seed/vlc/100/100",
                banner: "https://picsum.photos/seed/vlcbanner/600/300",
                desc: "The ultimate open-source media player. Plays everything."
            }
        ];

        // ═══════════════════════════════════════════════════════════
        // 2. RENDER APPS
        // ═══════════════════════════════════════════════════════════
        function renderApps() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';
            
            apps.forEach((app, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="card-banner">
                        <img src="${app.banner}" alt="${app.name}">
                        <span class="card-badge">${app.platform}</span>
                    </div>
                    <div class="card-content">
                        <img src="${app.icon}" class="card-icon" alt="icon">
                        <div class="card-info">
                            <h3>${app.name}</h3>
                            <div class="publisher">
                                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 8 12 12 16 14"/></svg>
                                By ${app.publisher}
                            </div>
                            <p class="desc">${app.desc}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ═══════════════════════════════════════════════════════════
        // 3. THEME ENGINE
        // ═══════════════════════════════════════════════════════════
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            
            // Update active button state
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ═══════════════════════════════════════════════════════════
        // 4. MODAL CONTROLS
        // ═══════════════════════════════════════════════════════════
        function openSettings() {
            document.getElementById('settingsModal').classList.add('open');
        }
        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('open');
        }

        // Close modal on outside click
        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) closeSettings();
        });

        // ═══════════════════════════════════════════════════════════
        // 5. INITIALIZATION
        // ═══════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            // Set Date
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateText').textContent = new Date().toLocaleDateString('en-US', dateOptions);

            // Render Apps
            renderApps();
            
            // Set default theme button
            document.querySelector('.theme-btn').classList.add('active');
        });
    </script>
</body>
</html>
