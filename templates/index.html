<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaming Hub - بوابة الألعاب والدردشة</title>
    <!-- استدعاء خط عربي جميل وأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           إعدادات CSS الأساسية (التصميم الزجاجي الداكن)
           ========================================= */
        :root {
            --bg-color: #14161a;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a5b1;
            --accent-blue: #2f80ed;
            --accent-green: #27ae60;
            --nav-bg: rgba(20, 22, 26, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% -20%, #2c3e50, #14161a);
        }

        /* شريط الحالة العلوي */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        /* الرأس (Header) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: transparent;
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title .logo {
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            color: var(--text-muted);
        }

        .header-title h1 {
            font-size: 16px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        /* التبويبات (Tabs) */
        .tabs {
            display: flex;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 25px;
            margin: 0 20px 15px;
            padding: 5px;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* حاوية المحتوى الرئيسي */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px;
            padding-bottom: 90px; /* مساحة للشريط السفلي */
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        /* أزرار الإجراءات السريعة (تحت التبويبات) */
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-box {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 15px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.2s;
        }

        .action-box i { font-size: 20px; color: var(--text-muted); }
        .action-box:active { background: rgba(255,255,255,0.1); }

        /* قائمة الدردشات (Chat List) */
        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 12px;
            backdrop-filter: blur(15px);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .chat-item:active { background: rgba(255,255,255,0.08); }

        .chat-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            margin-left: 15px;
            border: 2px solid transparent;
        }

        .chat-avatar.online { border-color: var(--accent-green); }

        .chat-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chat-preview {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .unread-badge {
            background: var(--accent-blue);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: auto;
        }

        /* الشريط السفلي (Bottom Navigation) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: var(--nav-bg);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(20px);
            z-index: 100;
            padding-bottom: 15px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--accent-blue); }

        .nav-badge {
            position: absolute;
            top: -5px;
            right: -10px;
            background: #eb5757;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* =========================================
           واجهات فرعية (شاشة الدردشة، شاشة الألعاب)
           ========================================= */
        .view-section {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .view-section.active {
            display: flex;
        }

        /* شاشة غرفة الدردشة */
        #chat-room-view {
            background: var(--bg-color);
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200;
        }

        .chat-room-header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--panel-border);
        }

        .chat-room-header .back-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            margin-left: 15px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.sent {
            background: var(--accent-blue);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: var(--nav-bg);
            border-top: 1px solid var(--panel-border);
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 25px;
            padding: 0 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .chat-input-area button {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        /* شاشة الألعاب */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding-bottom: 100px;
        }

        .game-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            aspect-ratio: 1/1;
        }

        .game-card img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0.7;
            transition: 0.3s;
        }

        .game-card:hover img { opacity: 1; transform: scale(1.05); }
        .game-card .game-title {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 15px 10px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            font-weight: 700; font-size: 14px; text-align: center;
        }

        /* مشغل الألعاب */
        #game-player-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 300;
            flex-direction: column;
        }
        
        .game-player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #111;
            color: #fff;
        }
        .game-player-header button {
            background: #eb5757; color: #fff; border: none;
            padding: 8px 15px; border-radius: 8px; cursor: pointer;
        }
        #game-iframe {
            flex: 1; width: 100%; border: none;
        }

    </style>
</head>
<body>

    <!-- واجهة النظام -->
    <div id="app-container">
        
        <!-- الرأس -->
        <div class="status-bar">
            <span>21:49</span>
            <span><i class="fas fa-wifi"></i> <i class="fas fa-battery-full"></i></span>
        </div>
        <header>
            <div class="header-title">
                <span class="logo">GH</span>
                <h1>بوابة الألعاب - الدردشة والإعدادات</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-new-chat"><i class="fas fa-edit"></i></button>
                <button class="icon-btn" id="btn-profile"><i class="fas fa-user-astronaut"></i></button>
            </div>
        </header>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chats')">كل الدردشات</button>
            <button class="tab-btn" onclick="switchTab('games')">مجلد الألعاب</button>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="main-content">
            
            <!-- قسم الدردشات -->
            <div id="chats-view" class="view-section active">
                <!-- أزرار الإجراءات السريعة -->
                <div class="quick-actions">
                    <div class="action-box" onclick="alert('ميزة إنشاء الدردشة الجماعية قيد التطوير')">
                        <i class="fas fa-users"></i>
                        <span>إنشاء دردشة جماعية<br>متجر العناصر</span>
                    </div>
                    <div class="action-box" onclick="alert('إعدادات الألعاب')">
                        <i class="fas fa-gamepad"></i>
                        <span>إعدادات الألعاب</span>
                    </div>
                    <div class="action-box" onclick="alert('الإعدادات السريعة')">
                        <i class="fas fa-cog"></i>
                        <span>الإعدادات السريعة</span>
                    </div>
                </div>

                <!-- قائمة الدردشات -->
                <div class="chat-list" id="dynamic-chat-list">
                    <!-- سيتم توليد الدردشات هنا بواسطة JS -->
                </div>
            </div>

            <!-- قسم الألعاب -->
            <div id="games-view" class="view-section">
                <div class="games-grid" id="games-grid-container">
                    <!-- سيتم توليد الألعاب هنا بواسطة JS -->
                </div>
            </div>

        </div>

        <!-- الشريط السفلي -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchMainView('home')">
                <i class="fas fa-home"></i>
                <span>واجهة رئيسية</span>
            </div>
            <div class="nav-item" onclick="switchMainView('games')">
                <i class="fas fa-search"></i>
                <span>بحث</span>
            </div>
            <div class="nav-item" onclick="switchMainView('chats')">
                <i class="fas fa-comment-dots"></i>
                <span class="nav-badge">1.5K</span>
                <span>دردشة</span>
            </div>
            <div class="nav-item" onclick="switchMainView('settings')">
                <i class="fas fa-cog"></i>
                <span>إعدادات</span>
            </div>
        </nav>

    </div>

    <!-- واجهة الدردشة الفردية (تظهر عند النقر على دردشة) -->
    <div id="chat-room-view" class="view-section">
        <div class="chat-room-header">
            <button class="back-btn" onclick="closeChatRoom()"><i class="fas fa-arrow-right"></i></button>
            <img id="room-avatar" src="" style="width: 40px; height: 40px; border-radius: 50%; margin-left: 10px;">
            <div>
                <h3 id="room-name" style="font-size: 16px;">اسم الدردشة</h3>
                <span id="room-status" style="font-size: 12px; color: var(--accent-green);">متصل الآن</span>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages-container">
            <!-- الرسائل هنا -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="اكتب رسالة..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- واجهة مشغل الألعاب (Full Screen) -->
    <div id="game-player-overlay">
        <div class="game-player-header">
            <h3 id="playing-game-title">اسم اللعبة</h3>
            <button onclick="closeGame()">إغلاق <i class="fas fa-times"></i></button>
        </div>
        <iframe id="game-iframe" src="" allow="fullscreen"></iframe>
    </div>

    <script>
        /* =========================================
           منطق جافا سكريبت (التطبيق الفعلي)
           ========================================= */

        // 1. إدارة المستخدم (بدون تسجيل دخول، يعتمد على المتصفح)
        function getCurrentUser() {
            let user = localStorage.getItem('gh_user');
            if (!user) {
                // إنشاء مستخدم جديد عشوائي إذا لم يكن موجوداً
                user = {
                    id: 'user_' + Math.random().toString(36).substr(2, 9),
                    name: 'لاعب_' + Math.floor(Math.random() * 1000),
                    avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=' + Math.random()
                };
                localStorage.setItem('gh_user', JSON.stringify(user));
            } else {
                user = JSON.parse(user);
            }
            return user;
        }
        const currentUser = getCurrentUser();

        // 2. قاعدة بيانات الدردشات (تخزين محلي + محاكاة سيرفر)
        const defaultChats = [
            {
                id: 'cod_server',
                name: 'خوادم الألعاب النشطة - Call of Duty',
                avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=cod',
                time: '18:30',
                preview: '50 متصلاً - انضم للعب!',
                unread: 838,
                type: 'group',
                messages: [
                    { sender: 'system', text: 'مرحباً بك في خادم Call of Duty', time: '18:00' }
                ]
            },
            {
                id: 'rpg_server',
                name: "خادم RPG: Kingdom's Rise",
                avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=rpg',
                time: '14:38',
                preview: 'بوت اللعب - تلميح أفضل ورقة',
                unread: 733,
                type: 'group',
                messages: [
                    { sender: 'system', text: 'البوت: تلميح أفضل ورقة هو الهجوم السريع', time: '14:35' }
                ]
            },
            {
                id: 'friend_spiderman',
                name: 'أصدقاء أونلاين - عمر',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=spiderman',
                time: 'الجمعة',
                preview: 'هل أنت مستعد للجولة؟',
                unread: 0,
                type: 'private',
                messages: [
                    { sender: 'them', text: 'هل أنت مستعد للجولة؟', time: '10:00' }
                ]
            },
            {
                id: 'friend_lily',
                name: 'ليلى 🟢',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=lily',
                time: 'الجمعة',
                preview: 'لقد حصلت على الكأس الذهبي!',
                unread: 0,
                type: 'private',
                messages: [
                    { sender: 'them', text: 'مرحباً، أريد شحن محفظي بطريقة: دولار', time: '11:20' },
                    { sender: 'them', text: 'لقد حصلت على الكأس الذهبي!', time: '11:21' }
                ]
            }
        ];

        // تحميل الدردشات من الذاكرة
        function getChats() {
            let chats = localStorage.getItem('gh_chats');
            if (!chats) {
                localStorage.setItem('gh_chats', JSON.stringify(defaultChats));
                return defaultChats;
            }
            return JSON.parse(chats);
        }

        // حفظ الدردشات
        function saveChats(chats) {
            localStorage.setItem('gh_chats', JSON.stringify(chats));
        }

        // 3. عرض قائمة الدردشات في الواجهة
        function renderChatList() {
            const container = document.getElementById('dynamic-chat-list');
            const chats = getChats();
            container.innerHTML = '';

            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.onclick = () => openChatRoom(chat.id);

                div.innerHTML = `
                    <img src="${chat.avatar}" class="chat-avatar ${chat.type === 'private' ? 'online' : ''}">
                    <div class="chat-info">
                        <div class="chat-header-row">
                            <span class="chat-name">${chat.name}</span>
                            <span class="chat-time">${chat.time}</span>
                        </div>
                        <div class="chat-header-row">
                            <span class="chat-preview">${chat.preview}</span>
                            ${chat.unread > 0 ? `<span class="unread-badge">${chat.unread}</span>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 4. إدارة فتح غرفة الدردشة
        let activeChatId = null;

        function openChatRoom(chatId) {
            activeChatId = chatId;
            const chats = getChats();
            const chat = chats.find(c => c.id === chatId);

            if (!chat) return;

            // تصفير عداد الرسائل غير المقروءة
            chat.unread = 0;
            saveChats(chats);

            // تحديث واجهة الغرفة
            document.getElementById('room-name').innerText = chat.name;
            document.getElementById('room-avatar').src = chat.avatar;
            
            // عرض الرسائل
            renderMessages(chat.messages);

            // إظهار الشاشة
            document.getElementById('chat-room-view').classList.add('active');
            renderChatList(); // تحديث القائمة لإخفاء العداد
        }

        function closeChatRoom() {
            document.getElementById('chat-room-view').classList.remove('active');
            activeChatId = null;
        }

        // 5. عرض الرسائل داخل الغرفة
        function renderMessages(messages) {
            const container = document.getElementById('chat-messages-container');
            container.innerHTML = '';

            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                // إذا كانت الرسالة من المستخدم الحالي أو النظام
                if (msg.sender === 'me' || msg.sender === currentUser.name) {
                    msgDiv.className = 'message sent';
                } else if (msg.sender === 'system') {
                    msgDiv.className = 'message received';
                    msgDiv.style.backgroundColor = '#333';
                    msgDiv.style.color = '#aaa';
                } else {
                    msgDiv.className = 'message received';
                }
                
                msgDiv.innerText = msg.text;
                container.appendChild(msgDiv);
            });

            // التمرير للأسفل
            container.scrollTop = container.scrollHeight;
        }

        // 6. إرسال رسالة
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            const chats = getChats();
            const chat = chats.find(c => c.id === activeChatId);

            // إضافة الرسالة
            const newMsg = {
                sender: 'me',
                text: text,
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            };
            
            chat.messages.push(newMsg);
            chat.preview = text;
            chat.time = newMsg.time;

            saveChats(chats);
            renderMessages(chat.messages);
            
            input.value = '';

            // محاكاة رد فوري (بوت) لتبدو دردشة حقيقية
            setTimeout(() => {
                const replies = [
                    "بالطبع، أنا معك.",
                    "لقد تلقيت رسالتك!",
                    "هل تريد اللعب الآن؟",
                    "دعنا ننتقل إلى الخادم الرئيسي.",
                    "مثير للاهتمام!"
                ];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                
                const chatsNow = getChats();
                const activeChatNow = chatsNow.find(c => c.id === activeChatId);
                if (activeChatNow) {
                    activeChatNow.messages.push({
                        sender: 'them',
                        text: randomReply,
                        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
                    });
                    activeChatNow.preview = randomReply;
                    saveChats(chatsNow);
                    
                    if (activeChatId === activeChatNow.id) {
                        renderMessages(activeChatNow.messages);
                    }
                }
            }, 1500); // بعد 1.5 ثانية
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // 7. إدارة الألعاب
        const gamesData = [
            { id: '2048', title: '2048', img: 'https://play-lh.googleusercontent.com/8xXW3Q8w5O8BwYf2p4z3R0V4c2B5X5O9v3Q9X1Y3Z8A=w240-h480-rw', url: 'https://play2048.co/' },
            { id: 'snake', title: 'Snake Classic', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Snake_game_screenshot.png/220px-Snake_game_screenshot.png', url: 'https://www.google.com/logos/2010/pacman10-i.html' }, // رابط باكمان كمثال
            { id: 'tetris', title: 'Tetris', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Tetris_logo.png/220px-Tetris_logo.png', url: 'https://chvin.github.io/react-tetris/' },
            { id: 'flappy', title: 'Flappy Bird', img: 'https://play-lh.googleusercontent.com/8xXW3Q8w5O8BwYf2p4z3R0V4c2B5X5O9v3Q9X1Y3Z8A=w240-h480-rw', url: 'https://flappybird.io/' }
        ];

        function renderGames() {
            const container = document.getElementById('games-grid-container');
            container.innerHTML = '';
            gamesData.forEach(game => {
                const div = document.createElement('div');
                div.className = 'game-card';
                div.onclick = () => openGame(game.url, game.title);
                div.innerHTML = `
                    <img src="${game.img}" alt="${game.title}">
                    <div class="game-title">${game.title}</div>
                `;
                container.appendChild(div);
            });
        }

        function openGame(url, title) {
            document.getElementById('playing-game-title').innerText = title;
            document.getElementById('game-iframe').src = url;
            document.getElementById('game-player-overlay').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('game-player-overlay').style.display = 'none';
            document.getElementById('game-iframe').src = ''; // إيقاف اللعبة
        }

        // 8. التنقل بين التبويبات والواجهات
        function switchTab(tabName) {
            // تغيير شكل الأزرار
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            // إظهار القسم المناسب
            document.getElementById('chats-view').classList.remove('active');
            document.getElementById('games-view').classList.remove('active');

            if (tabName === 'chats') {
                document.getElementById('chats-view').classList.add('active');
            } else if (tabName === 'games') {
                document.getElementById('games-view').classList.add('active');
            }
        }

        function switchMainView(view) {
            // تغيير شكل الأزرار السفلية
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            if (event && event.currentTarget) event.currentTarget.classList.add('active');

            // للتبسيط، نربط الأزرار السفلية بالتبويبات العلوية
            if (view === 'home') {
                document.querySelectorAll('.tab-btn')[0].click();
            } else if (view === 'games' || view === 'chats') {
                document.querySelectorAll('.tab-btn')[1].click(); // أو أي تبويب تريده
            } else {
                alert('هذه الصفحة قيد الإنشاء');
            }
        }

        // =========================================
        // تشغيل التطبيق عند التحميل
        // =========================================
        window.onload = function() {
            renderChatList();
            renderGames();
            
            // إضافة مستمع للحدث للتفاعل مع الرسائل الجديدة من نوافذ أخرى (محاكاة سيرفر)
            if (window.BroadcastChannel) {
                const bc = new BroadcastChannel('gh_chat_sync');
                bc.onmessage = (event) => {
                    // تحديث الواجهة إذا جاءت رسالة جديدة من نافذة أخرى
                    if (event.data === 'update') {
                        renderChatList();
                        if (activeChatId) {
                            const chats = getChats();
                            const chat = chats.find(c => c.id === activeChatId);
                            if (chat) renderMessages(chat.messages);
                        }
                    }
                };
            }

            // تحديث الدردشات كل 5 ثوانٍ لضمان المزامنة
            setInterval(() => {
                 if (!activeChatId) renderChatList();
            }, 5000);
        };
    </script>
</body>
</html>
